<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="main.css">
    <title>contact us</title>
</head>
<body class="form-body">
    <div class="form-contaner">
        <h1 class="tit">Contact Us</h1>
        <span class="tex">Fill in your information</span>
        <form class="form" action="" method="post">
        <div class="input_group">
            <label for="username">Full Name</label>
            <input type="text" name="username" id="username" class="input" placeholder="Enter your full name" >
            <p class="message"></p>
        </div>

         <div class="input_group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" class="input" placeholder="Enter your email" >
            <p class="message"></p>
        </div>
        <button class="sub" type="button" onclick="validate()">Submit</button>
       </form>
    </div>
 <script src="main.js" ></script>
</body>
</html>
